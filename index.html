<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUHAMMED FADHIL EH | Software Engineer</title>
    <style>
        :root {
            --obsidian: #050505;
            --pearl: #EAEAEA;
            --accent: #B0A171;
        }
        body { background-color: var(--obsidian); color: var(--pearl); font-family: 'Inter', sans-serif; overflow-x: hidden; }

        /* CURSOR SYSTEM */
        body { cursor: none; }
        .custom-cursor { 
            position: fixed; top: 0; left: 0; width: 6px; height: 6px; 
            background: var(--accent); pointer-events: none; border-radius: 50%;
            z-index: 999999; transform: translate(-50%, -50%);
        }
        .cursor-follower { 
            position: fixed; top: 0; left: 0; width: 26px; height: 26px; 
            border: 1px solid rgba(176, 161, 113, 0.4); pointer-events: none; 
            border-radius: 50%; z-index: 999998; transform: translate(-50%, -50%);
            transition: transform 0.1s ease-out;
        }
        #interaction-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 999997; }
    </style>
</head>
<body>
    <canvas id="interaction-canvas"></canvas>
    <div class="custom-cursor"></div>
    <div class="cursor-follower"></div>

    <script>
        const dot = document.querySelector('.custom-cursor');
        const ring = document.querySelector('.cursor-follower');
        let mouseX = 0, mouseY = 0;
        let dotX = 0, dotY = 0;
        let ringX = 0, ringY = 0;

        window.addEventListener('mousemove', e => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animate() {
            // Instant snap for dot
            dotX = mouseX;
            dotY = mouseY;
            
            // Smooth lag for ring
            ringX += (mouseX - ringX) * 0.15;
            ringY += (mouseY - ringY) * 0.15;

            dot.style.left = dotX + 'px';
            dot.style.top = dotY + 'px';
            ring.style.left = ringX + 'px';
            ring.style.top = ringY + 'px';

            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
